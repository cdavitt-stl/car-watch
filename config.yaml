# Car Watch search parameters
zip: "63125"
radius_miles: 30
max_price: 24000
min_price_flag: 21000   # cars under this still show, just flagged as unusually cheap
max_miles: 120000        # skip anything above this — adjust as you like

vehicles:
  - { make: "Honda",  model: "Civic" }
  - { make: "Toyota", model: "Corolla" }

# Dealer names matched case-insensitively as substrings, so "Suntrup" also
# matches "Suntrup Ford Westport". Matches get a ★ on the Dealer cell.
preferred_dealers:
  - "Weiss Toyota"
  - "Dave Sinclair"
  - "Ackerman Toyota"
  - "Seeger Toyota"
  - "Lou Fusz"
  - "Bommarito"
  - "Frank Leta"
  - "Suntrup"
  - "EchoPark"

# Known-problem model years. Matches are flagged in the Flags column, never
# removed from results. trim_keywords is optional — omit it to match all trims.
# Trim keywords are matched case-insensitively as substrings.
watchlist:
  - make: "Honda"
    model: "Civic"
    year_min: 2016
    year_max: 2018
    trim_keywords: ["EX-T", "EX-L", "Touring", "1.5T"]
    severity: "avoid"
    reason: "1.5T oil dilution issue"

  - make: "Honda"
    model: "Civic"
    year_min: 2016
    year_max: 2016
    severity: "avoid"
    reason: "first model year + A/C condenser failures"

  - make: "Toyota"
    model: "Corolla"
    year_min: 2019
    year_max: 2020
    severity: "caution"
    reason: "first year of redesign"

# Output goes to the Google Sheet identified by the SHEET_ID env var.
# No secrets belong in this file.
